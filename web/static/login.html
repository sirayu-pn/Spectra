<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Spectra Server Monitor</title>
  <meta name="description" content="Sign in to access Spectra server telemetry dashboard">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css?v=1.2.0">
  <style>
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background-color: var(--bg-page);
    }

    .login-card {
      width: 100%;
      max-width: 400px;
      background: #ffffff;
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: clamp(24px, 5vw, 36px);
      box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05), 0 2px 6px -1px rgba(0, 0, 0, 0.02);
      display: flex;
      flex-direction: column;
    }

    .login-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 28px;
    }

    .login-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .login-logo h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-primary);
    }

    .login-sub {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .input-field {
      width: 100%;
      height: 42px;
      padding: 0 14px;
      font-family: var(--font-sans);
      font-size: 14px;
      color: var(--text-primary);
      background-color: var(--bg-subtle);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-sm);
      outline: none;
      transition: all 0.15s ease;
    }

    .input-field:focus {
      background-color: #ffffff;
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.12);
    }

    .login-btn {
      width: 100%;
      height: 44px;
      margin-top: 6px;
      background-color: var(--text-primary);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-sm);
      font-family: var(--font-sans);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.15s ease;
    }

    .login-btn:hover {
      background-color: #1e293b;
    }

    .login-btn:active {
      transform: scale(0.98);
    }

    .login-btn.loading {
      opacity: 0.7;
      pointer-events: none;
    }

    .error-banner {
      display: none;
      background-color: #fef2f2;
      border: 1px solid #fecaca;
      color: #b91c1c;
      font-size: 12.5px;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      margin-bottom: 18px;
      line-height: 1.4;
      text-align: center;
    }

    .login-footer {
      margin-top: 24px;
      text-align: center;
      font-size: 11.5px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">
          <span class="logo-mark">●</span>
          <h1>Spectra</h1>
        </div>
        <p class="login-sub">Sign in to access server telemetry and real-time dashboard</p>
      </div>

      <div class="error-banner" id="error-banner">
        Invalid username or password
      </div>

      <form class="login-form" id="login-form">
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input 
            type="text" 
            id="username" 
            name="username" 
            class="input-field" 
            placeholder="Enter username" 
            required 
            autofocus 
            autocomplete="username"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            class="input-field" 
            placeholder="••••••••" 
            required 
            autocomplete="current-password"
          >
        </div>

        <button type="submit" class="login-btn" id="login-btn">
          <span>Sign In</span>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>
      </form>

      <div class="login-footer">
        Spectra &bull; Protected Access
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const userField = document.getElementById('username');
    const passField = document.getElementById('password');
    const submitBtn = document.getElementById('login-btn');
    const errorBanner = document.getElementById('error-banner');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBanner.style.display = 'none';
      submitBtn.classList.add('loading');
      submitBtn.querySelector('span').textContent = 'Signing in...';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: userField.value.trim(),
            password: passField.value
          })
        });

        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          throw new Error(errData.error || 'Invalid credentials');
        }

        // Redirect to dashboard upon successful login
        window.location.href = '/';
      } catch (err) {
        errorBanner.textContent = err.message || 'Invalid username or password';
        errorBanner.style.display = 'block';
        passField.value = '';
        passField.focus();
      } finally {
        submitBtn.classList.remove('loading');
        submitBtn.querySelector('span').textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
