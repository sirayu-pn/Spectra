services:
  spectra:
    build:
      context: .
      dockerfile: Dockerfile
    image: spectra:latest
    container_name: spectra
    restart: unless-stopped
    ports:
      - "5050:5050"
    environment:
      - PORT=5050
      # Enables gopsutil to read Linux host statistics when volumes below are mounted
      - HOST_PROC=/host/proc
      - HOST_SYS=/host/sys
      - HOST_ETC=/host/etc
    volumes:
      # Host metric mounts for Linux servers
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc:/host/etc:ro
      - /:/host/rootfs:ro
    # For full host network monitoring on Linux (optional):
    # network_mode: host
